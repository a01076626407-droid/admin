<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>서울특별시 재난 안전 대피소 통합 플랫폼</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

<!-- 상단 헤더 -->
<header class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 h-16 flex items-center justify-between">
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="location.reload()">
            <div class="w-9 h-9 bg-blue-600 rounded-lg flex items-center justify-center text-white text-lg shadow-sm">
                <i class="fa-solid fa-shield-halved"></i>
            </div>
            <span class="text-base font-bold text-slate-900">서울재난안전가이드</span>
        </div>
        <span class="inline-flex items-center gap-1.5 px-3 py-1 rounded-full text-xs font-semibold bg-emerald-50 text-emerald-700 border border-emerald-200">
            <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
            전체 대피소 DB 연동 완료
        </span>
    </div>
</header>

<!-- 메인 본문 -->
<main class="max-w-6xl mx-auto px-4 py-6 flex-1 w-full space-y-5">

    <!-- 탭 메뉴 버튼 -->
    <div class="flex gap-2 border-b border-slate-200 pb-3 flex-wrap">
        <button id="airTabBtn" onclick="switchTab('air')" class="px-4 py-2 text-sm font-bold rounded-xl bg-blue-600 text-white shadow-sm transition">
            <i class="fa-solid fa-person-shelter mr-1.5"></i> 공습 대피소
        </button>
        <button id="eqTabBtn" onclick="switchTab('eq')" class="px-4 py-2 text-sm font-bold rounded-xl bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">
            <i class="fa-solid fa-house-chimney-crack mr-1.5"></i> 지진 대피소
        </button>
        <button id="floodTabBtn" onclick="switchTab('flood')" class="px-4 py-2 text-sm font-bold rounded-xl bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition">
            <i class="fa-solid fa-water mr-1.5"></i> 홍수 대피소
        </button>
    </div>

    <!-- 대피소 목록 카드 박스 -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm">
        <div class="flex justify-between items-center pb-4 mb-4 border-b border-slate-100">
            <div>
                <h2 id="sectionTitle" class="font-bold text-slate-800 text-base">📊 민방위 공습 대피소 목록</h2>
                <p id="sectionDesc" class="text-xs text-slate-400 mt-0.5">카드를 클릭하면 상세 정보를 확인할 수 있습니다.</p>
            </div>
            <span id="apiEndpointBadge" class="text-xs font-mono bg-blue-50 text-blue-700 px-2.5 py-1 rounded-md border border-blue-100">
                GET /api/airraid/shelters
            </span>
        </div>

        <!-- 대피소 카드가 들어갈 영역 -->
        <div id="resultsList" class="space-y-3 max-h-[500px] overflow-y-auto pr-1">
            <div class="text-center py-12 text-slate-400">
                <i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-500 mb-2"></i>
                <p class="text-sm">데이터를 불러오는 중...</p>
            </div>
        </div>
    </div>
</main>

<!-- 상세 정보 모달 팝업 -->
<div id="detailModal" class="fixed inset-0 bg-black/50 hidden items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl max-w-lg w-full p-6 shadow-xl space-y-4">
        <div class="flex justify-between items-center border-b pb-3">
            <h3 class="font-bold text-slate-900 text-base"><i class="fa-solid fa-circle-info text-blue-600 mr-2"></i>대피소 상세 정보</h3>
            <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 text-lg font-bold px-2">&times;</button>
        </div>
        <div id="modalContent" class="space-y-2 text-sm text-slate-700">
            <!-- 상세 데이터가 동적으로 들어감 -->
        </div>
        <div class="flex justify-end pt-2">
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-800 text-sm font-bold rounded-xl transition">닫기</button>
        </div>
    </div>
</div>

<script>
    document.addEventListener("DOMContentLoaded", () => {
        loadData('air');
    });

    function switchTab(mode) {
        const airBtn = document.getElementById('airTabBtn');
        const eqBtn = document.getElementById('eqTabBtn');
        const floodBtn = document.getElementById('floodTabBtn');
        const title = document.getElementById('sectionTitle');
        const desc = document.getElementById('sectionDesc');
        const badge = document.getElementById('apiEndpointBadge');

        [airBtn, eqBtn, floodBtn].forEach(btn => {
            btn.className = "px-4 py-2 text-sm font-bold rounded-xl bg-white text-slate-600 border border-slate-200 hover:bg-slate-100 transition";
        });

        let endpoint = '';
        if (mode === 'air') {
            airBtn.className = "px-4 py-2 text-sm font-bold rounded-xl bg-blue-600 text-white shadow-sm transition";
            title.innerText = "📊 민방위 공습 대피소 목록";
            endpoint = '/api/airraid/shelters';
        } else if (mode === 'eq') {
            eqBtn.className = "px-4 py-2 text-sm font-bold rounded-xl bg-blue-600 text-white shadow-sm transition";
            title.innerText = "📊 지진 대피소 목록";
            endpoint = '/api/earthquake/shelters';
        } else {
            floodBtn.className = "px-4 py-2 text-sm font-bold rounded-xl bg-blue-600 text-white shadow-sm transition";
            title.innerText = "📊 홍수 대피소 목록";
            endpoint = '/api/flood/shelters';
        }
        badge.innerText = `GET ${endpoint}`;
        loadDataContent(endpoint, mode);
    }

    function loadDataContent(endpoint, mode) {
        const listArea = document.getElementById('resultsList');
        listArea.innerHTML = `<div class="text-center py-12 text-slate-400"><i class="fa-solid fa-circle-notch fa-spin text-2xl text-blue-500 mb-2"></i><p class="text-sm">데이터를 불러오는 중...</p></div>`;

        fetch(endpoint)
            .then(response => response.json())
            .then(data => {
                if (!Array.isArray(data) || data.length === 0) {
                    listArea.innerHTML = `<p class="text-center py-8 text-slate-400 text-sm">등록된 대피소 데이터가 없습니다.</p>`;
                    return;
                }

                let htmlCards = '';
                data.forEach((item, index) => {
                    const fcltName = item.fcltNm || item.vtAcmdfcltNm || item.fclt_nm || item.vt_acmdfclt_nm || '시설명 없음';
                    const address = item.daddr || item.rdnmadrCd || item.rdnmadr_cd || '주소 정보 없음';

                    let badgeText = mode === 'air' ? '공습 대피소' : (mode === 'eq' ? '지진 대피소' : '홍수 대피소');
                    let badgeColor = mode === 'air' ? 'bg-blue-100 text-blue-700' : (mode === 'eq' ? 'bg-amber-100 text-amber-700' : 'bg-emerald-100 text-emerald-700');

                    // 객체 데이터를 안전하게 전달하기 위해 JSON 문자열로 변환하여 onclick에 주입
                    const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');

                    htmlCards += `
                        <div onclick="openModal('${itemJson}', '${badgeText}')" class="border border-slate-200 rounded-xl p-4 bg-slate-50 hover:bg-blue-50/40 hover:border-blue-300 transition cursor-pointer flex justify-between items-center">
                            <div>
                                <div class="flex items-center gap-2 mb-1">
                                    <span class="${badgeColor} text-xs font-bold px-2 py-0.5 rounded">#${index + 1} ${badgeText}</span>
                                    <h3 class="text-sm font-bold text-slate-900">${fcltName}</h3>
                                </div>
                                <p class="text-xs text-slate-500">📍 ${address}</p>
                            </div>
                            <span class="text-xs font-bold text-blue-600 bg-white border border-slate-200 px-2.5 py-1 rounded-md shrink-0">
                                상세 보기
                            </span>
                        </div>
                    `;
                });
                listArea.innerHTML = htmlCards;
            })
            .catch(() => {
                listArea.innerHTML = `<div class="border border-red-200 bg-red-50 rounded-xl p-6 text-center text-red-600"><p class="font-bold text-sm">데이터 로드 실패</p></div>`;
            });
    }

    function loadData(mode) {
        loadDataContent('/api/airraid/shelters', mode);
    }

    function openModal(itemStr, typeName) {
        const item = JSON.parse(itemStr.replace(/&quot;/g, '"'));
        const modal = document.getElementById('detailModal');
        const content = document.getElementById('modalContent');

        const fcltName = item.fcltNm || item.vtAcmdfcltNm || item.fclt_nm || item.vt_acmdfclt_nm || '정보 없음';
        const address = item.daddr || item.rdnmadrCd || item.rdnmadr_cd || '정보 없음';
        const lat = item.lat || item.la || '정보 없음';
        const lot = item.lot || item.lo || '정보 없음';
        const dept = item.mngDeptNm || item.mng_dept_nm || '정보 없음';

        content.innerHTML = `
            <p><strong>유형:</strong> <span class="text-blue-600 font-semibold">${typeName}</span></p>
            <p><strong>시설명:</strong> ${fcltName}</p>
            <p><strong>주소:</strong> ${address}</p>
            <p><strong>위도:</strong> ${lat}</p>
            <p><strong>경도:</strong> ${lot}</p>
            <p><strong>관리부서:</strong> ${dept}</p>
        `;
        modal.classList.remove('hidden');
        modal.classList.add('flex');
    }

    function closeModal() {
        const modal = document.getElementById('detailModal');
        modal.classList.remove('flex');
        modal.classList.add('hidden');
    }
</script>
</body>
</html>
