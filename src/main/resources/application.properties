# ==========================================
# [데이터베이스 연결 설정] (윈도우/리눅스 공용 호환)
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# DB_HOST가 있으면 해당 IP/도메인, 없으면 localhost 기본 연결
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/shelter_db?useSSL=false&serverTimezone=Asia/Seoul&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ==========================================
# [JPA / Hibernate 설정]
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# data.sql 자동 실행 방지 (Python/DataInitializer로 데이터 적재 관리)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# 파일 업로드 용량 설정 (필요시)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB