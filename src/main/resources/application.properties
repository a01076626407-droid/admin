# ==========================================================
# [src/main/resources/application.properties]
# ==========================================================

# 1. 톰캣 웹 서버 포트 번호 (기본값: 8080)
server.port=8080

# 2. MySQL 드라이버 클래스 지정 (MySQL과 자바를 이어주는 통신 규격)
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 3. MySQL 데이터베이스 연결 주소 (shelter_project DB로 정확히 지정)
# serverTimezone=Asia/Seoul: 한국 시간대 설정, characterEncoding=UTF-8: 한글 깨짐 방지
spring.datasource.url=jdbc:mysql://localhost:3306/shelter_project?useSSL=false&serverTimezone=Asia/Seoul&characterEncoding=UTF-8&allowPublicKeyRetrieval=true

# 4. MySQL 접속 계정 아이디 (기본: root)
spring.datasource.username=root

# 5. MySQL 접속 계정 비밀번호 (본인의 실제 MySQL 비밀번호로 수정하세요! 예: root 또는 1234)
spring.datasource.password=root

# 6. JPA / Hibernate 동작 설정
# update: 우리가 만든 테이블 구조를 유지하면서 엔티티 변경점만 안전하게 반영
spring.jpa.hibernate.ddl-auto=update

# 7. 실행되는 SQL 쿼리문을 IntelliJ 콘솔창에 예쁘게 포맷팅하여 출력
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# 8. MySQL 8버전 전용 SQL 방언(Dialect) 명시 (하이버네이트 연결 오류 원천 방어)
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect