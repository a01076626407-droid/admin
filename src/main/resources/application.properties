spring.application.name=demo
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# earthquake_db 데이터베이스 연결 주소
spring.datasource.url=jdbc:mysql://localhost:3306/earthquake_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# MySQL 사용자 계정
spring.datasource.username=root

# MySQL 설치 시 설정한 본인의 비밀번호 입력
spring.datasource.password=root

# JPA 설정 (엔티티를 바탕으로 테이블 자동 생성 및 SQL 로그 출력)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true