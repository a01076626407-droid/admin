spring.application.name=demo

# ==========================================
# [데이터베이스 연결 설정] (윈도우/리눅스 공용 스마트 호환)
# ==========================================
# 환경 변수(.env / 시스템 환경변수)가 존재하면 1순위 적용, 미설정 시 localhost 로컬 기본값 적용
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:shelter_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ==========================================
# [커넥션 풀(HikariCP) 안정화 설정]
# ==========================================
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=600000
spring.datasource.hikari.max-lifetime=1800000

# ==========================================
# [JPA / Hibernate 설정]
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# data.sql 자동 실행 방지 (Python Script / DataInitializer로 정밀 적재)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false

# ==========================================
# [공공데이터 포털 API 연동 설정]
# ==========================================
# .env에 API_KEY가 있으면 적용, 없으면 빈 값으로 안전하게 대체 (Fallback)
api.airstrike.key=${API_KEY:}
api.earthquake.key=${EARTHQUAKE_API_KEY:}

# ==========================================
# [웹 및 파일 업로드 설정]
# ==========================================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
spring.thymeleaf.cache=false