# ==========================================
# [데이터베이스 연결 설정] (윈도우/리눅스 공용 호환)
# ==========================================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 💡 윈도우에서는 기본값(localhost)으로 동작하고,
# 💡 리눅스 서버에서는 환경 변수(DB_HOST)를 주입받아 동적으로 변경됩니다!
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:3306/shelter_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true

# 💡 계정 정보도 환경 변수가 없으면 기본값(root)을 사용합니다.
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# ==========================================
# [JPA / Hibernate 설정]
# ==========================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# 💡 data.sql 자동 실행으로 인한 충돌을 막기 위해 off로 변경
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=false