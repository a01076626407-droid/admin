# 1. 어떤 데이터베이스를 쓸 건지 주소를 알려줍니다. 
# (disaster_db 자리에 본인이 1번 단계에서 만든 데이터베이스 이름을 적어주세요!)
spring.datasource.url=jdbc:mysql://localhost:3306/disaster_db?serverTimezone=Asia/Seoul
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# 2. 앞서 맞추신 최고 관리자 계정과, 본인의 MySQL 비밀번호를 적습니다.
spring.datasource.username=root
spring.datasource.password=root

# 3. 주방장과 냉장고 관리자가 일하는 모습(SQL)을 콘솔 창에 보여달라는 옵션입니다.
spring.jpa.show-sql=true

# 4. [마법의 코드] 우리가 만든 User.java(엔티티) 설계도를 보고, 
# 스프링부트가 알아서 MySQL 안에 'user'라는 표(테이블)를 만들어줍니다!
spring.jpa.hibernate.ddl-auto=update