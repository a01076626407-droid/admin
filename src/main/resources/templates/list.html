<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>방명록 게시판</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

<main class="max-w-4xl mx-auto px-4 py-10 flex-1 w-full space-y-6">
    <!-- 상단 타이틀 박스 -->
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm flex justify-between items-center">
        <div class="flex items-center gap-3">
            <div class="w-10 h-10 bg-blue-600 rounded-xl flex items-center justify-center text-white text-lg shadow-sm">
                <i class="fa-solid fa-clipboard-list"></i>
            </div>
            <div>
                <h1 class="font-bold text-slate-900 text-lg">방명록 게시판</h1>
                <p class="text-xs text-slate-400">10개씩 모아서 볼 수 있는 게시판입니다.</p>
            </div>
        </div>
        <a href="/posts/write" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white text-sm font-bold rounded-xl shadow-sm transition">
            글 쓰러 가기
        </a>
    </div>

    <!-- 게시글 테이블 박스 -->
    <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
        <table class="w-full text-left border-collapse">
            <thead>
            <tr class="border-b border-slate-200 bg-slate-50 text-xs font-bold text-slate-500 uppercase">
                <th class="py-3.5 px-6 w-16 text-center">번호</th>
                <th class="py-3.5 px-6">제목</th>
                <th class="py-3.5 px-6 w-32">작성자</th>
                <th class="py-3.5 px-6">내용</th>
            </tr>
            </thead>
            <tbody class="divide-y divide-slate-100 text-sm">
            <!-- DB에서 가져온 10개의 글 데이터를 반복문으로 출력 -->
            <tr th:each="post, stat : ${paging.content}" class="hover:bg-slate-50/80 transition">
                <td class="py-4 px-6 text-center text-slate-400 font-mono text-xs"
                    th:text="${paging.totalElements - (paging.number * paging.size) - stat.index}">1</td>
                <td class="py-4 px-6 font-bold text-blue-600">
                    <!-- 제목을 누르면 해당 글 번호(id)의 상세 페이지로 이동합니다 -->
                    <a th:href="@{/posts/{id}(id=${post.id})}" class="hover:underline" th:text="${post.title}">제목</a>
                </td>
                <td class="py-4 px-6 text-slate-600 text-xs" th:text="${post.writer != null ? post.writer : '익명'}">작성자</td>
                <td class="py-4 px-6 text-slate-500 truncate max-w-xs" th:text="${post.content}">내용</td>
            </tr>
            </tbody>
        </table>

        <!-- 하단 페이징 버튼 영역 -->
        <div class="p-4 border-t border-slate-100 flex justify-center items-center gap-2 bg-slate-50/50" th:if="${paging.totalPages > 0}">
            <!-- 이전 페이지 버튼 -->
            <a th:if="${paging.hasPrevious}" th:href="@{/posts(page=${paging.number - 1})}"
               class="px-3 py-1.5 bg-white border border-slate-200 text-slate-600 text-xs font-bold rounded-lg hover:bg-slate-100 transition">
                이전
            </a>

            <!-- 페이지 번호 버튼들 (1, 2...) -->
            <span th:each="pageNumber : ${#numbers.sequence(0, paging.totalPages - 1)}">
                <a th:href="@{/posts(page=${pageNumber})}"
                   th:text="${pageNumber + 1}"
                   class="px-3 py-1.5 text-xs font-bold rounded-lg transition"
                   th:classappend="${pageNumber == paging.number} ? 'bg-blue-600 text-white shadow-sm' : 'bg-white border border-slate-200 text-slate-600 hover:bg-slate-100'">
                   1
                </a>
            </span>

            <!-- 다음 페이지 버튼 -->
            <a th:if="${paging.hasNext}" th:href="@{/posts(page=${paging.number + 1})}"
               class="px-3 py-1.5 bg-white border border-slate-200 text-slate-600 text-xs font-bold rounded-lg hover:bg-slate-100 transition">
                다음
            </a>
        </div>
    </div>
</main>

</body>
</html>
