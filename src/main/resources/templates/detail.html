<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>게시글 상세 보기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

<main class="max-w-2xl mx-auto px-4 py-16 flex-1 w-full">
  <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6">
    <!-- 상단 타이틀 -->
    <div class="border-b border-slate-100 pb-4 flex justify-between items-center">
      <h1 class="font-bold text-slate-900 text-xl" th:text="${post.title}">글 제목</h1>
      <span class="text-xs text-slate-400 font-mono" th:text="'번호: ' + ${post.id}">ID</span>
    </div>

    <!-- 작성시간 정보 출력 영역 -->
    <div class="text-xs text-slate-400 flex items-center gap-2">
      <i class="fa-regular fa-clock text-slate-400 text-sm"></i>
      <span th:text="${post.createDate != null ? #temporals.format(post.createDate, 'yyyy-MM-dd HH:mm') : '방금 전'}">작성시간</span>
    </div>

    <!-- 글 내용 박스 -->
    <div class="bg-slate-50 rounded-xl p-6 border border-slate-100 min-h-[160px] text-sm leading-relaxed text-slate-700 whitespace-pre-wrap"
         th:text="${post.content}">
      글 내용이 들어가는 자리입니다.
    </div>

    <!-- 하단 버튼 영역 -->
    <div class="pt-4 flex justify-between items-center">
      <a href="/posts" class="px-6 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-bold rounded-xl shadow-sm transition text-xs">
        ← 목록으로
      </a>
      <a th:if="${session.loginUser != null and session.loginUser == post.writer}"
         th:href="@{/posts/delete/{id}(id=${post.id})}"
         onclick="return confirm('정말 이 글을 삭제하시겠습니까?');"
         class="px-6 py-2.5 bg-rose-600 hover:bg-rose-700 text-white font-bold rounded-xl shadow-sm transition text-xs">
        <i class="fa-solid fa-trash-can mr-1"></i> 삭제하기
      </a>
    </div>
  </div>
</main>

</body>
</html>
