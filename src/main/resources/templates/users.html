<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>사용자 권한 관리</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style> body { zoom: 150%; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">
<header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
  <div class="flex items-center gap-2">
    <div class="w-8 h-8 bg-indigo-600 rounded-lg flex items-center justify-center text-white text-sm shadow-sm">
      <i class="fa-solid fa-users-gear"></i>
    </div>
    <h1 class="font-bold text-slate-900 text-base">사용자 권한 관리 센터</h1>
  </div>
  <div class="flex items-center gap-3">
    <a href="/posts" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl transition">
      <i class="fa-solid fa-arrow-left mr-1"></i> 게시글 목록으로
    </a>
    <a th:href="@{/logout}" class="px-3 py-1.5 bg-red-500 hover:bg-red-600 text-white text-xs font-bold rounded-xl shadow-sm transition">
      로그아웃
    </a>
  </div>
</header>

<main class="max-w-4xl mx-auto px-4 py-10 flex-1 w-full space-y-6">
  <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
    <div>
      <h2 class="font-bold text-slate-900 text-base">전체 사용자 권한 승인 및 제어</h2>
      <p class="text-xs text-slate-400">체크박스를 클릭하면 권한이 즉시 부여/회수되며 실시간으로 자동 저장됩니다.</p>
    </div>

    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-xs">
        <thead>
        <tr class="border-b border-slate-200 text-slate-500 bg-slate-50">
          <th class="py-3 px-4">번호</th>
          <th class="py-3 px-4">아이디</th>
          <th class="py-3 px-4">이름</th>
          <th class="py-3 px-4">현재 역할</th>
          <th class="py-3 px-4 text-center">수정 권한</th>
          <th class="py-3 px-4 text-center">삭제 권한</th>
        </tr>
        </thead>
        <tbody class="divide-y divide-slate-100">
        <tr th:each="u, stat : ${userList}" class="hover:bg-slate-50/50 transition">
          <td class="py-3 px-4 text-slate-500" th:text="${stat.index + 1}">1</td>
          <td class="py-3 px-4 font-bold text-slate-800" th:text="${u.username}">user1</td>
          <td class="py-3 px-4 text-slate-600" th:text="${u.realname}">홍길동</td>
          <td class="py-3 px-4">
            <span th:id="|role-${u.id}|"
                  th:class="${u.role == 'SUPER' ? 'px-2 py-0.5 bg-rose-50 text-rose-600 font-bold rounded' : (u.role == 'ADMIN' ? 'px-2 py-0.5 bg-blue-50 text-blue-600 font-bold rounded' : 'px-2 py-0.5 bg-slate-100 text-slate-500 rounded')}"
                  th:text="${u.role}">USER</span>
          </td>

          <!-- 수정 권한 체크박스 -->
          <td class="py-3 px-4 text-center">
            <input type="checkbox"
                   th:id="|edit-${u.id}|"
                   th:checked="${u.canEdit or u.role == 'SUPER'}"
                   th:disabled="${u.role == 'SUPER'}"
                   th:onchange="|updatePermission(${u.id})|"
                   class="w-4 h-4 text-blue-600 rounded border-slate-300 cursor-pointer focus:ring-blue-500 disabled:opacity-50 disabled:cursor-not-allowed">
          </td>

          <!-- 삭제 권한 체크박스 -->
          <td class="py-3 px-4 text-center">
            <input type="checkbox"
                   th:id="|delete-${u.id}|"
                   th:checked="${u.canDelete or u.role == 'SUPER'}"
                   th:disabled="${u.role == 'SUPER'}"
                   th:onchange="|updatePermission(${u.id})|"
                   class="w-4 h-4 text-rose-600 rounded border-slate-300 cursor-pointer focus:ring-rose-500 disabled:opacity-50 disabled:cursor-not-allowed">
          </td>
        </tr>
        </tbody>
      </table>
    </div>
  </div>
</main>

<script th:inline="javascript">
  function updatePermission(userId) {
    const editCheckbox = document.getElementById('edit-' + userId);
    const deleteCheckbox = document.getElementById('delete-' + userId);

    const canEdit = editCheckbox ? editCheckbox.checked : false;
    const canDelete = deleteCheckbox ? deleteCheckbox.checked : false;

    fetch('/admin/users/permissions/' + userId, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded',
      },
      body: new URLSearchParams({
        canEdit: canEdit,
        canDelete: canDelete
      })
    })
            .then(response => {
              if (!response.ok) {
                throw new Error('서버 응답 오류 (' + response.status + ')');
              }
              return response.json();
            })
            .then(data => {
              const roleBadge = document.getElementById('role-' + userId);
              if (roleBadge && data.role) {
                roleBadge.innerText = data.role;
                if (data.role === 'ADMIN') {
                  roleBadge.className = 'px-2 py-0.5 bg-blue-50 text-blue-600 font-bold rounded';
                } else if (data.role === 'USER') {
                  roleBadge.className = 'px-2 py-0.5 bg-slate-100 text-slate-500 rounded';
                }
              }
            })
            .catch(error => {
              console.error('권한 변경 실패:', error);
              alert('권한 저장에 실패했습니다. 다시 시도해주세요.');
            });
  }
</script>
</body>
</html>
