<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 작성</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 화면 전체를 175% 확대해서 보여줍니다 -->
    <style>
        body {
            zoom: 175%;
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

<main class="max-w-2xl mx-auto px-4 py-16 flex-1 w-full">
    <div class="bg-white rounded-2xl border border-slate-200 p-8 shadow-sm space-y-6">
        <div class="text-center space-y-2">
            <h1 class="font-bold text-slate-900 text-2xl">방명록 작성하기</h1>
            <p class="text-xs text-slate-400">자유롭게 의견을 남겨주세요.</p>
        </div>

        <!-- 데이터를 서버로 전송하는 form 태그 (POST 방식) -->
        <form action="/posts/write" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">제목</label>
                <input type="text" name="title" required placeholder="제목을 입력하세요"
                       class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500 transition">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 mb-1">내용</label>
                <textarea name="content" rows="6" required placeholder="내용을 입력하세요"
                          class="w-full px-4 py-2.5 rounded-xl border border-slate-200 text-sm focus:outline-none focus:border-blue-500 transition resize-none"></textarea>
            </div>

            <div class="pt-2">
                <!-- 등록하기 버튼 색상을 파란색(bg-blue-600)으로 변경했습니다 -->
                <button type="submit" class="w-full py-3 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-sm transition text-sm">
                    등록하기
                </button>
            </div>
        </form>

        <div class="text-center pt-2">
            <a href="/posts" class="text-xs text-blue-600 hover:underline font-bold">
                ← 게시글 목록으로 돌아가기
            </a>
        </div>
    </div>
</main>

</body>
</html>
