<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>게시글 수정</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style> body { zoom: 150%; } </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col antialiased">

<header class="bg-white border-b border-slate-200 px-6 py-4 flex justify-between items-center shadow-sm">
    <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-lg flex items-center justify-center text-white text-sm shadow-sm">
            <i class="fa-solid fa-pen-to-square"></i>
        </div>
        <h1 class="font-bold text-slate-900 text-base">서울재난안전가이드</h1>
    </div>
    <a href="/posts" class="px-3 py-1.5 bg-slate-100 hover:bg-slate-200 text-slate-700 text-xs font-bold rounded-xl shadow-sm transition">
        <i class="fa-solid fa-arrow-left mr-1"></i> 목록으로 돌아가기
    </a>
</header>

<main class="max-w-2xl mx-auto px-4 py-10 flex-1 w-full space-y-6">
    <div class="bg-white rounded-2xl border border-slate-200 p-6 shadow-sm space-y-4">
        <div>
            <h2 class="font-bold text-slate-900 text-base">게시글 수정</h2>
            <p class="text-xs text-slate-400">작성자: <span th:text="${post.writer}" class="font-semibold text-slate-600">작성자명</span></p>
        </div>

        <!-- 💡 onsubmit 검증 함수 추가 -->
        <form th:action="@{/posts/edit/{id}(id=${post.id})}" method="post" onsubmit="return validateEditForm()" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">제목</label>
                <!-- 💡 id="title" 추가 -->
                <input type="text" id="title" name="title" th:value="${post.title}" required
                       class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-700 mb-1">내용</label>
                <!-- 💡 id="content" 추가 -->
                <textarea id="content" name="content" th:text="${post.content}" required rows="8"
                          class="w-full px-3 py-2 border border-slate-200 rounded-xl text-xs focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div class="flex justify-end gap-2 pt-2">
                <a th:href="@{/posts}" class="px-4 py-2 bg-slate-200 hover:bg-slate-300 text-slate-700 text-xs font-bold rounded-xl transition">
                    취소
                </a>
                <button type="submit" class="px-4 py-2 bg-amber-600 hover:bg-amber-700 text-white text-xs font-bold rounded-xl shadow-sm transition">
                    수정 완료
                </button>
            </div>
        </form>
    </div>
</main>

<!-- 💡 공백(스페이스바) 방어 스크립트 -->
<script>
    function validateEditForm() {
        const titleInput = document.getElementById('title');
        const contentInput = document.getElementById('content');

        if (!titleInput.value || titleInput.value.trim() === '') {
            alert('제목에 공백 외 1자 이상의 문자를 입력해 주세요.');
            titleInput.focus();
            return false;
        }

        if (!contentInput.value || contentInput.value.trim() === '') {
            alert('내용에 공백 외 1자 이상의 문자를 입력해 주세요.');
            contentInput.focus();
            return false;
        }

        return true;
    }
</script>

</body>
</html>
