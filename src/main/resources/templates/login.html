<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <style>
        body {
            background-color: #f5f6fa;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            font-family: sans-serif;
        }
        .login-container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 350px;
        }
        h2 { text-align: center; margin-bottom: 25px; color: #333; }
        .input-group { margin-bottom: 15px; }
        .input-group label { display: block; font-size: 12px; color: #666; margin-bottom: 5px; }
        .input-group input {
            width: 100%; padding: 10px; border: 1px solid #ccc;
            border-radius: 5px; box-sizing: border-box; font-size: 14px;
        }
        .login-btn {
            width: 100%; padding: 12px; background-color: #007bff;
            color: white; border: none; border-radius: 5px;
            font-size: 16px; cursor: pointer; font-weight: bold; margin-top: 10px;
        }
        .login-btn:hover { background-color: #0056b3; }
        .signup-link { text-align: center; margin-top: 15px; font-size: 12px; }
        .signup-link a { color: #007bff; text-decoration: none; }

        /* 🟢 에러 메시지 디자인 */
        .error-message {
            color: #dc3545; font-size: 13px; text-align: center;
            margin-bottom: 15px; font-weight: bold;
        }
    </style>
</head>
<body>

<div class="login-container">
    <h2>로그인</h2>

    <!-- 🟢 서버에서 에러 메시지를 넘겨줬을 때만 이 박스가 화면에 나타납니다 -->
    <div th:if="${errorMessage}" class="error-message" th:text="${errorMessage}"></div>

    <form action="/api/users/login" method="POST">
        <div class="input-group">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="input-group">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="login-btn">로그인</button>
    </form>

    <div class="signup-link">
        계정이 없으신가요? <a href="/signup">회원가입</a>
    </div>
</div>

</body>
</html>
